apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: incidentlens-slo-rules
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: incidentlens.slo
      interval: 30s
      rules:
        # prometheus-fastapi-instrumentator: http_requests_total{handler,method,status}
        # status is grouped: 2xx, 3xx, 4xx, 5xx

        - record: incidentlens:checkout_requests:rate5m
          expr: |
            sum(
              rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics"
              }[5m])
            )

        - record: incidentlens:checkout_errors:rate5m
          expr: |
            sum(
              rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics",
                status="5xx"
              }[5m])
            )

        - record: incidentlens:checkout_latency:p95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  namespace="demo-app",
                  service="checkout",
                  handler="/checkout"
                }[1m])
              )
            )

        - record: incidentlens:checkout:availability5m
          expr: |
            1 -
            (
              incidentlens:checkout_errors:rate5m
              /
              clamp_min(incidentlens:checkout_requests:rate5m, 0.001)
            )

        - record: incidentlens:checkout:slo_error_ratio
          expr: |
            1 - incidentlens:checkout:availability5m

    - name: incidentlens.burnrate
      interval: 30s
      rules:
        - alert: CheckoutAvailabilityBurnRateFast
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics",
                status="5xx"
              }[5m]))
              /
              clamp_min(sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics"
              }[5m])), 0.001)
            ) > (14.4 * 0.01)
            and
            (
              sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics",
                status="5xx"
              }[1h]))
              /
              clamp_min(sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics"
              }[1h])), 0.001)
            ) > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
            service: checkout
            namespace: demo-app
            slo: availability
          annotations:
            summary: "Checkout availability SLO is burning rapidly"
            description: "Checkout 5xx ratio exceeded the fast burn threshold (5m and 1h windows)."

        - alert: CheckoutAvailabilityBurnRateSlow
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics",
                status="5xx"
              }[30m]))
              /
              clamp_min(sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics"
              }[30m])), 0.001)
            ) > (6 * 0.01)
            and
            (
              sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics",
                status="5xx"
              }[6h]))
              /
              clamp_min(sum(rate(http_requests_total{
                namespace="demo-app",
                service="checkout",
                handler!="/metrics"
              }[6h])), 0.001)
            ) > (6 * 0.01)
          for: 10m
          labels:
            severity: warning
            service: checkout
            namespace: demo-app
            slo: availability
          annotations:
            summary: "Checkout availability SLO is burning"
            description: "Checkout 5xx ratio exceeded the slow burn threshold (30m and 6h windows)."

        - alert: CheckoutLatencySLOViolation
          expr: |
            incidentlens:checkout_latency:p95 > 0.300
          for: 5m
          labels:
            severity: warning
            service: checkout
            namespace: demo-app
            slo: latency
          annotations:
            summary: "Checkout p95 latency exceeds 300ms"
            description: "Checkout p95 latency has exceeded the 300ms SLO."
