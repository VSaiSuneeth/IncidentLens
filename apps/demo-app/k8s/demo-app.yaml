apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo-app
  labels:
    app: checkout
    team: checkout-team
    environment: local
    gitops: managed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        team: checkout-team
        environment: local
    spec:
      containers:
        - name: checkout
          image: incidentlens/demo-app:dev
          imagePullPolicy: Never
          env:
            - name: OTEL_SERVICE_NAME
              value: checkout
            - name: CHECKOUT_DELAY_MS
              value: "0"
          command:
            - python3
            - -m
            - uvicorn
            - checkout.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: demo-app
  labels:
    app: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: http-metrics
      port: 8000
      targetPort: 8000
---
