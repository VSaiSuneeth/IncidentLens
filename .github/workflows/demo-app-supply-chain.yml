name: demo-app-supply-chain

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/demo-app/**"
      - ".github/workflows/demo-app-supply-chain.yml"
  pull_request:
    paths:
      - "apps/demo-app/**"

permissions:
  contents: read

jobs:
  scan-and-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build demo app image
        run: docker build -t incidentlens/demo-app:${{ github.sha }} apps/demo-app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incidentlens/demo-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Cosign installation
        run: cosign version

      - name: GitOps bump reminder
        run: |
          echo "Image built and security-scanned successfully."
          echo "Update image tag in gitops/incidentlens-app.yaml (or platform-gitops) for Argo CD sync — no hand kubectl apply."
