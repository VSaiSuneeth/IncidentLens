name: demo-app-supply-chain

on:
  push:
    paths:
      - "apps/demo-app/**"
      - ".github/workflows/demo-app-supply-chain.yml"
  pull_request:
    paths:
      - "apps/demo-app/**"

permissions:
  contents: read
  id-token: write

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build demo app image
        run: docker build -t incidentlens/demo-app:${{ github.sha }} apps/demo-app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incidentlens/demo-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless on main)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes incidentlens/demo-app:${{ github.sha }}

      - name: GitOps bump reminder
        run: |
          echo "Update image tag in gitops/incidentlens-app.yaml (or platform-gitops) for Argo CD sync — no hand kubectl apply."
