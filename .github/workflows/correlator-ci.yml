name: correlator-ci

on:
  push:
    paths:
      - "services/correlator/**"
  pull_request:
    paths:
      - "services/correlator/**"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile services/correlator/*.py

      - name: Build correlator image
        run: docker build -t incidentlens/correlator:${{ github.sha }} services/correlator
