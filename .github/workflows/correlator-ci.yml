name: correlator-ci

on:
  push:
    paths:
      - "services/correlator/**"
      - "docs/**"
      - "README.md"
      - "scripts/validate_docs.py"
      - "scripts/validate_manifests.py"
  pull_request:
    paths:
      - "services/correlator/**"
      - "docs/**"
      - "README.md"
      - "scripts/validate_docs.py"
      - "scripts/validate_manifests.py"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile services/correlator/*.py

      - name: Validate public documentation
        run: python scripts/validate_docs.py

      - name: Install service dependencies
        run: python -m pip install -r services/correlator/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s services/correlator/tests -v

      - name: Validate Kubernetes and observability manifests
        run: python scripts/validate_manifests.py

      - name: Build correlator image
        run: docker build -t incidentlens/correlator:${{ github.sha }} services/correlator
