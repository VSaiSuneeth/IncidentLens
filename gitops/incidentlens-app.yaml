apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incidentlens-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/VSaiSuneeth/IncidentLens.git
    targetRevision: main
    path: apps/demo-app/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true